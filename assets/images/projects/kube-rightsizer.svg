<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-12 kube-rightsizer schematic</title>
<desc>Prometheus usage history and a ResourcePolicy CRD feed a reconcile loop, p95 engine and GitOps patcher that open a pull request. Live Deployments are read-only.</desc>
<defs>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0H0V16" fill="none" stroke="#f8fafc" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0H0V80" fill="none" stroke="#f8fafc" stroke-opacity="0.09" stroke-width="1"/>
</pattern>
<marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0L8 4L0 8z" fill="#f8fafc" fill-opacity="0.7"/>
</marker>
<marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0L8 4L0 8z" fill="#60a5fa"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="360" fill="#020617"/>
<rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
<rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

<rect x="0" y="0" width="640" height="28" fill="#020617" stroke="#f8fafc" stroke-opacity="0.5" stroke-width="1"/>
<text x="16" y="18" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#f8fafc">PN-12 · KUBE-RIGHTSIZER · PULL-REQUEST-ONLY RIGHT-SIZING</text>

<g font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em">
<!-- controller group -->
<rect x="168" y="52" width="268" height="200" fill="none" stroke="#f8fafc" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 4"/>
<text x="180" y="66" font-size="9" fill="#f8fafc" fill-opacity="0.7">KUBE-RIGHTSIZER CONTROLLER</text>

<!-- inputs -->
<rect x="16" y="64" width="120" height="44" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text x="28" y="82" font-size="10" fill="#f8fafc">RESOURCEPOLICY</text>
<text x="28" y="96" font-size="9" fill="#f8fafc" fill-opacity="0.7">CRD · thresholds</text>

<rect x="16" y="150" width="120" height="44" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text x="28" y="168" font-size="10" fill="#f8fafc">PROMETHEUS</text>
<text x="28" y="182" font-size="9" fill="#f8fafc" fill-opacity="0.7">usage history</text>

<rect x="16" y="240" width="120" height="44" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text x="28" y="258" font-size="10" fill="#f8fafc">LIVE DEPLOYMENTS</text>
<text x="28" y="272" font-size="9" fill="#f8fafc" fill-opacity="0.7">read-only</text>

<!-- controller boxes -->
<rect x="184" y="84" width="236" height="36" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text x="200" y="100" font-size="10" fill="#f8fafc">RECONCILE LOOP</text>
<text x="200" y="112" font-size="9" fill="#f8fafc" fill-opacity="0.7">watches ResourcePolicy CRs</text>

<rect x="184" y="140" width="236" height="36" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text x="200" y="156" font-size="10" fill="#f8fafc">P95 ENGINE</text>
<text x="200" y="168" font-size="9" fill="#f8fafc" fill-opacity="0.7">+headroom · min/max clamp</text>

<rect x="184" y="196" width="236" height="36" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text x="200" y="212" font-size="10" fill="#f8fafc">GITOPS PATCHER</text>
<text x="200" y="224" font-size="9" fill="#f8fafc" fill-opacity="0.7">requests/limits only</text>

<!-- right column -->
<rect x="468" y="84" width="156" height="44" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text x="480" y="102" font-size="10" fill="#f8fafc">GITOPS REPO</text>
<text x="480" y="116" font-size="9" fill="#f8fafc" fill-opacity="0.7">manifests · GitHub</text>

<rect x="468" y="160" width="156" height="44" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text x="480" y="178" font-size="10" fill="#f8fafc">PULL REQUEST</text>
<text x="480" y="192" font-size="9" fill="#f8fafc" fill-opacity="0.7">reviewed · CI · merge</text>

<rect x="468" y="240" width="156" height="44" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text x="480" y="258" font-size="10" fill="#f8fafc">GRAFANA</text>
<text x="480" y="272" font-size="9" fill="#f8fafc" fill-opacity="0.7">waste vs actual</text>

<!-- readouts -->
<rect x="168" y="276" width="120" height="40" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text x="180" y="290" font-size="9" fill="#f8fafc" fill-opacity="0.7">PERCENTILE</text>
<text x="180" y="306" font-size="14" fill="#60a5fa">p95</text>

<rect x="300" y="276" width="132" height="40" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text x="312" y="290" font-size="9" fill="#f8fafc" fill-opacity="0.7">DEFAULT HEADROOM</text>
<text x="312" y="306" font-size="14" fill="#60a5fa">15%</text>

<text x="16" y="340" font-size="9" fill="#f8fafc" fill-opacity="0.6">NEVER MUTATES LIVE OBJECTS · CHANGES LAND VIA REVIEW</text>
</g>

<g fill="none" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1">
<path d="M136 86H184" marker-end="url(#aw)"/>
<path d="M136 172H152V102H184" marker-end="url(#aw)"/>
<path d="M136 262H158V112H184" stroke-dasharray="4 3" marker-end="url(#aw)"/>
<path d="M302 120V140" stroke="#60a5fa" stroke-opacity="1" marker-end="url(#ab)"/>
<path d="M302 176V196" stroke="#60a5fa" stroke-opacity="1" marker-end="url(#ab)"/>
<path d="M420 214H444V106H468" stroke="#60a5fa" stroke-opacity="1" marker-end="url(#ab)"/>
<path d="M546 128V160" stroke="#60a5fa" stroke-opacity="1" marker-end="url(#ab)"/>
<path d="M468 262H455" stroke-dasharray="4 3" marker-end="url(#aw)" visibility="hidden"/>
</g>
</svg>