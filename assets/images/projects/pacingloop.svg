<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-08 pacingloop system schematic</title>
<desc>A seeded simulator feeds a hour-of-week median and MAD baseline and a multi-signal classifier that emits explained alerts. A damped controller with a hard spend ceiling outputs spend, a multiplier trace and an audit log.</desc>
<defs>
<style>.m{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;letter-spacing:.06em;fill:#f8fafc}.h{font-size:10px}.s{font-size:9px;fill-opacity:.7}.v{font-size:14px;fill:#60a5fa}</style>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#f8fafc" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#f8fafc" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f8fafc" fill-opacity="0.7"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#60a5fa"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" fill="#020617"/>
<rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
<rect x="0" y="0" width="640" height="360" fill="url(#major)"/>
<rect x="16" y="16" width="608" height="24" fill="none" stroke="#f8fafc" stroke-opacity="0.4" stroke-width="1"/>
<text class="m h" x="28" y="32">PN-08 · PACINGLOOP · ROBUST BASELINE + DAMPED CONTROL</text>

<rect class="readout" x="32" y="72" width="136" height="36" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text class="m v" x="44" y="90">4/4</text>
<text class="m s" x="44" y="103">INCIDENTS DETECTED</text>
<rect x="32" y="116" width="136" height="36" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text class="m v" x="44" y="134">0.00</text>
<text class="m s" x="44" y="147">FALSE ALARMS/WEEK</text>

<rect x="216" y="72" width="160" height="48" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text class="m h" x="226" y="92">BASELINE.TS</text>
<text class="m s" x="226" y="108">168-BUCKET MEDIAN/MAD</text>

<rect x="32" y="160" width="136" height="56" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text class="m h" x="42" y="180">SIM.TS</text>
<text class="m s" x="42" y="196">SEASONAL STREAM</text>

<rect x="216" y="160" width="160" height="56" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text class="m h" x="226" y="180">DETECT.TS</text>
<text class="m s" x="226" y="196">MULTI-SIGNAL CLASSIFY</text>

<rect x="432" y="160" width="176" height="56" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text class="m h" x="442" y="180">ALERTS</text>
<text class="m s" x="442" y="196">EXPLAINED · PER HOUR</text>

<text class="m s" x="432" y="100">SIGNALS: SPEND · CLICKS · INSTALLS</text>

<rect x="216" y="246" width="160" height="52" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text class="m h" x="226" y="266">CONTROL.TS</text>
<text class="m s" x="226" y="282">DAMPED · RATE-LIMITED</text>

<rect x="432" y="246" width="176" height="52" fill="#020617" stroke="#60a5fa" stroke-width="1"/>
<text class="m h" x="442" y="266">SPEND CEILING</text>
<text class="m s" x="442" y="282">HARD CAP · OUTSIDE CTRL</text>

<rect x="432" y="316" width="176" height="28" fill="#020617" stroke="#f8fafc" stroke-opacity="0.6" stroke-width="1"/>
<text class="m h" x="442" y="334">SPEND + TRACE + AUDIT LOG</text>

<line x1="168" y1="188" x2="216" y2="188" stroke="#60a5fa" stroke-width="1" marker-end="url(#b)"/>
<line x1="296" y1="120" x2="296" y2="160" stroke="#f8fafc" stroke-opacity="0.7" stroke-width="1" marker-end="url(#a)"/>
<line x1="376" y1="188" x2="432" y2="188" stroke="#60a5fa" stroke-width="1" marker-end="url(#b)"/>
